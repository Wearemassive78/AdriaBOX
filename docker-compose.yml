networks:
  adriabox-net:
    driver: bridge

services:
  metadata:
    build: .
    container_name: adriabox-metadata-1
    command: python src/metadata_server/server.py
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    networks:
      - adriabox-net
    environment:
      - PYTHONPATH=/app/src
      - ADRIABOX_STORAGE_NODES=storage1:storage1:7001:127.0.0.1:7001,storage2:storage2:7002:127.0.0.1:7002,storage3:storage3:7003:127.0.0.1:7003,storage4:storage4:7004:127.0.0.1:7004,storage5:storage5:7005:127.0.0.1:7005,storage6:storage6:7006:127.0.0.1:7006,storage7:storage7:7007:127.0.0.1:7007,storage8:storage8:7008:127.0.0.1:7008,storage9:storage9:7009:127.0.0.1:7009,storage10:storage10:7010:127.0.0.1:7010,storage11:storage11:7011:127.0.0.1:7011,storage12:storage12:7012:127.0.0.1:7012

  # --- STORAGE CLUSTER NODES (Corrected Flags) ---

  storage1:
    build: .
    container_name: adriabox-storage-1
    command: python src/storage_node/node.py --host 0.0.0.0 --tcp-port 7001 --storage-dir /app/storage/storage1
    ports:
      - "7001:7001"
    volumes:
      - ./data/storage/storage1:/app/storage/storage1
    networks:
      - adriabox-net
    environment:
      - PYTHONPATH=/app/src

